version: "3.8"

services:
  warehousevision:
    build: .
    container_name: warehousevision-app
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=warehousevision
      - MODEL_PATH=models/warehouse_model.pt
      - UPLOAD_DIR=uploads
      - RESULT_DIR=results
      - MAX_UPLOAD_SIZE_MB=500
    volumes:
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./models:/app/models
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: warehousevision-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
